<!DOCTYPE html>
<html>
<head><title>Flask-WTF Form</title></head>
<body>
  <h2>Flask-WTF Validation</h2>
  <form method="POST">
    {{ form.hidden_tag() }}
    <p>{{ form.name.label }} {{ form.name() }}
      {% for e in form.name.errors %}<span style="color:red">{{ e }}</span>{% endfor %}
    </p>
    <p>{{ form.email.label }} {{ form.email() }}
      {% for e in form.email.errors %}<span style="color:red">{{ e }}</span>{% endfor %}
    </p>
    <p>{{ form.submit() }}</p>
  </form>
  <p style="color:green">{{ msg }}</p>
</body>
</html>
